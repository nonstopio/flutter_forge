group 'com.nonstopio.contact.permission.contact_permission'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Flutter 3.44+ configures Kotlin for plugins, including AGP's built-in mode.
apply plugin: 'com.android.library'

android {
    namespace 'com.nonstopio.contact.permission.contact_permission'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // 1.19 requires compileSdk 37; Flutter 3.47 targets compileSdk 36.
    implementation 'androidx.core:core:1.18.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
