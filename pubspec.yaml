name: flutter_forge
description: A place where Flutter packages are crafted and built.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.5'

dev_dependencies:
  test: ^1.31.1
  coverage: ^1.15.0
  flutter_lints: ^6.0.0
  melos: 8.8.0
  path: ^1.9.1
  pubspec_parse: ^1.3.0
  mason_logger: ^0.3.1

workspace:
  - packages/cli_core
  - packages/connectivity_wrapper/example
  - packages/connectivity_wrapper
  - packages/dzod/example
  - packages/dzod
  - packages/html_rich_text/example
  - packages/html_rich_text
  - packages/morse_tap/example
  - packages/morse_tap
  - packages/nonstop_cli/bricks/flutter_app_for_mono_repo/hooks
  - packages/nonstop_cli/bricks/flutter_package_for_mono_repo/hooks
  - packages/nonstop_cli/bricks/flutter_plugin_for_mono_repo/hooks
  - packages/nonstop_cli/bricks/flutter_project_with_mono_repo/hooks
  - packages/nonstop_cli
  - packages/ns_firebase_utils
  - packages/ns_intl_phone_input/example
  - packages/ns_intl_phone_input
  - packages/ns_utils
  - packages/timer_button/example
  - packages/timer_button
  - plugins/contact_permission/example
  - plugins/contact_permission
  - tools/readme_sync

melos:
  command:
    version:
      workspaceChangelog: false
      # Fetch explicitly in the release CLI, without Melos pulling main mid-run.
      fetchTags: false
      updateGitTagRefs: false
      linkToCommits: false
      hooks:
        preCommit: dart run melos run update_nonstop_cli_version && dart run melos run update_nonstop_cli_bundles

  scripts:
    lint:
      description: "Run format and analyze all packages"
      # Check owned source once from the workspace root. Git omits ignored SDK
      # and build artifacts; untracked source is included during development.
      run: |
        git ls-files -z --cached --others --exclude-standard -- '*.dart' \
          ':(exclude)**/__brick__/**' ':(exclude)**/coverage/**' ':(exclude)**/build/**' \
          | xargs -0 dart format --output=none --set-exit-if-changed &&
        dart analyze --fatal-infos .
    fix:
      description: "Apply Dart automated fixes to all packages"
      exec:
        command: dart fix --apply
        concurrency: 5
      packageFilters:
        dirExists: lib
    test:
      description: "Run every package test and require 100% line coverage"
      run: python3 tools/coverage.py
    test:coverage:
      description: "Run every package test and require 100% line coverage"
      run: python3 tools/coverage.py
    update_nonstop_cli_version:
      run: dart run tools/update_nonstop_cli_version.dart
    update_nonstop_cli_bundles:
      run: dart run tools/update_nonstop_cli_bundles.dart
    sync:readme:
      description: "Sync README sections across all packages"
      run: dart run tools/readme_sync/readme_sync.dart
