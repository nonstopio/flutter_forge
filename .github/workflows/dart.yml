name: Dart

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify coverage gate behavior
        run: python3 -m unittest discover -s tools/tests
      - name: Check formatting and analyze workspace
        run: dart run melos run lint
      - name: Require 100% coverage in every package
        run: python3 tools/coverage.py
      - name: Save test logs and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-coverage
          path: |
            coverage/
            packages/**/coverage/
            plugins/**/coverage/
            tools/**/coverage/

  native-permissions:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Require 100% native permission-plugin coverage
        run: python3 plugins/contact_permission/native_tests/run.py
      - name: Save native coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-permission-coverage
          path: |
            plugins/contact_permission/native_tests/coverage/
            plugins/contact_permission/native_tests/android/build/reports/
