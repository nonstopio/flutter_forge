name: Report release failure

on:
  workflow_run:
    workflows: ['Prepare pub.dev release', 'Publish to pub.dev']
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  issues: write

concurrency:
  group: release-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      contains(fromJSON('["failure", "timed_out", "cancelled", "action_required", "startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run is privileged: execute only the default branch's reporter,
      # never scripts/artifacts checked out from the failed run's head SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { reportFailure } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-failure.mjs`);
            await reportFailure({ github, context, core });
