name: NonStop generated template
on:
  pull_request:
    paths: ['packages/nonstop_cli/**', 'packages/cli_core/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/nonstop-template.yml']
  push:
    branches: [main]
    paths: ['packages/nonstop_cli/**', 'packages/cli_core/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/nonstop-template.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nonstop_cli
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze --fatal-infos lib test tool
      - run: dart test --exclude-tags version-verify
  generated:
    needs: contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, default, minimal, auth-only, firestore-only, network-only]
    defaults:
      run:
        working-directory: packages/nonstop_cli
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/verify_template.dart ${{ matrix.profile }}
