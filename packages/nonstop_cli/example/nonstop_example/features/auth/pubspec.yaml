name: auth
description: "Firebase Authentication (email, Google, Apple) with go_router integration for Nonstop Example."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_ui_auth: ^3.1.1
  firebase_ui_oauth_apple: ^2.1.1
  firebase_ui_oauth_google: ^2.1.1
  go_router: ^18.0.1
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  di:
    path: ../../packages/di
  localization:
    path: ../../packages/localization
  network:
    path: ../../packages/network
  analytics:
    path: ../../packages/analytics

dev_dependencies:
  mocktail: ^1.0.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

resolution: workspace
