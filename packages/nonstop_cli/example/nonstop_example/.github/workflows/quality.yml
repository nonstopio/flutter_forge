name: Template quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: dart pub global activate melos 8.8.0
      - run: dart pub get
      - run: melos bootstrap
      - run: melos run lint
      - run: melos run coverage
      - run: flutter build web
        working-directory: apps/nonstop_example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
