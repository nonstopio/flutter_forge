name: {{ name.snakeCase() }}_workspace

###############################################################################
# MONOREPO CONFIGURATION
###############################################################################
# apps/     - runnable Flutter applications
# features/ - vertical slices (ui + state + data) that an app composes
# packages/ - horizontal capabilities shared by features (network, design, ...)
# plugins/  - platform channels and native integrations
packages:
  - apps/*
  - features/*
  - packages/*
  - plugins/*

command:
  bootstrap:
    dependencies:
      json_annotation: ^4.9.0
    dev_dependencies:
      build_runner: ^2.4.15
      flutter_lints: ^5.0.0
      json_serializable: ^6.9.5

###############################################################################
# SCRIPTS
###############################################################################
scripts:
  clean:flutter:
    description: "Run flutter clean in all Flutter packages"
    run: flutter clean
    exec:
      concurrency: 4
    packageFilters:
      flutter: true

  lint:
    description: "Check formatting and analyze all workspace code"
    run: dart run tool/check.dart

  fix:
    description: "Apply Dart automated fixes to all packages"
    run: dart fix --apply
    exec:
      concurrency: 5
    packageFilters:
      dirExists: lib

  fix:dry:
    description: "Show Dart automated fixes without applying them"
    run: dart fix --dry-run
    exec:
      concurrency: 5
    packageFilters:
      dirExists: lib

  generate:
    description: "Run build_runner in every package that needs codegen"
    run: dart run build_runner build --delete-conflicting-outputs
    exec:
      concurrency: 1
    packageFilters:
      dependsOn: build_runner

  generate:i69n:
    description: "Regenerate localization strings from messages.i69n.yaml"
    run: |
      dart run build_runner build --delete-conflicting-outputs &&
      dart format lib/messages.i69n.dart
    exec:
      concurrency: 1
    packageFilters:
      scope: "localization"

  test:
    description: "Run all tests (Dart and Flutter)"
    run: dart run melos run test:select --no-select

  coverage:
    description: "Run every test and require 100% handwritten line coverage"
    run: dart run tool/coverage.dart

  test:select:
    description: "Run tests in Flutter packages"
    run: flutter test --coverage
    exec:
      concurrency: 5
      failFast: true
    packageFilters:
      dirExists: test

###############################################################################
# IDE CONFIGURATION
###############################################################################
ide:
  intellij:
    enabled: true
    moduleNamePrefix: ''
