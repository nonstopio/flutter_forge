name: dashboard
description: "Bottom-navigation shell and starter tabs for {{name.titleCase()}}."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  di:
    path: ../../packages/di
  localization:
    path: ../../packages/localization
{{#auth}}  auth:
    path: ../auth
{{/auth}}{{#developer}}  developer:
    path: ../../packages/developer
{{/developer}}
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

resolution: workspace
