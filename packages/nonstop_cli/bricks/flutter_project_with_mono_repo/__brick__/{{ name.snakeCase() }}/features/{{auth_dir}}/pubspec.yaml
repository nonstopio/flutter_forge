name: auth
description: "Firebase Authentication (email, Google, Apple) with go_router integration for {{name.titleCase()}}."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_ui_auth: ^3.1.1
  firebase_ui_oauth_apple: ^2.1.1
  firebase_ui_oauth_google: ^2.1.1
  go_router: ^18.0.1
  json_annotation: ^4.9.0
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  di:
    path: ../../packages/di
  localization:
    path: ../../packages/localization
{{#firestore}}  cloud_firestore: ^6.10.0
{{/firestore}}{{#network}}  network:
    path: ../../packages/network
{{/network}}{{#analytics}}  analytics:
    path: ../../packages/analytics
{{/analytics}}
dev_dependencies:
  mocktail: ^1.0.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

resolution: workspace
