name: auth
description: "Firebase Authentication (email, Google, Apple) with go_router integration for {{name.titleCase()}}."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  firebase_auth: ^5.6.0
  firebase_core: ^3.14.0
  firebase_ui_auth: ^1.17.0
  firebase_ui_oauth_apple: ^1.3.2
  firebase_ui_oauth_google: ^1.4.2
  go_router: ^15.1.3
  json_annotation: ^4.9.0
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  di:
    path: ../../packages/di
  localization:
    path: ../../packages/localization
{{#firestore}}  cloud_firestore: ^5.6.0
{{/firestore}}{{#network}}  network:
    path: ../../packages/network
{{/network}}{{#analytics}}  analytics:
    path: ../../packages/analytics
{{/analytics}}
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
