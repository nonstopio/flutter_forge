publish_to: 'none'

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  go_router: ^15.1.3
  intl: ^0.20.2
  json_annotation: ^4.9.0
  navigation_history_observer: ^1.1.1
  talker_bloc_logger: ^4.9.1
  talker_flutter: ^4.4.1
  di:
    path: ../di
  localization:
    path: ../localization
{{#firebase}}  firebase_core: ^3.14.0
{{/firebase}}{{#auth}}  firebase_auth: ^5.3.4
{{/auth}}{{#firestore}}  cloud_firestore: ^5.5.3
  cloud_functions: ^5.2.3
{{/firestore}}
dev_dependencies:
