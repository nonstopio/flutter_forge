name: notifications
description: "Firebase Cloud Messaging, permissions and device-token management for {{name.titleCase()}}."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  app_badge_plus: ^1.1.2
  crypto: ^3.0.6
  device_info_plus: ^11.1.1
  firebase_core: ^3.14.0
  firebase_messaging: ^15.1.6
  go_router: ^15.1.3
  json_annotation: ^4.9.0
  permission_handler: ^11.1.0
  timezone: ^0.9.4
  core:
    path: ../core
  design_system:
    path: ../design_system
  di:
    path: ../di
{{#network}}  network:
    path: ../network
{{/network}}{{#analytics}}  analytics:
    path: ../analytics
{{/analytics}}
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
