name: {{name.snakeCase()}}
description: "{{{description}}}"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.3
  bloc: ^9.0.0
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  di:
    path: ../../packages/di
  localization:
    path: ../../packages/localization
  utils:
    path: ../../packages/utils
{{#firebase}}  firebase_core: ^3.14.0
{{/firebase}}{{#network}}  network:
    path: ../../packages/network
{{/network}}{{#analytics}}  analytics:
    path: ../../packages/analytics
{{/analytics}}{{#crashlytics}}  crashlytics:
    path: ../../packages/crashlytics
{{/crashlytics}}{{#feature_flags}}  feature_flags:
    path: ../../packages/feature_flags
{{/feature_flags}}{{#notifications}}  notifications:
    path: ../../packages/notifications
{{/notifications}}{{#developer}}  developer:
    path: ../../packages/developer
{{/developer}}{{#auth}}  auth:
    path: ../../features/auth
{{/auth}}{{#dashboard}}  dashboard:
    path: ../../features/dashboard
{{/dashboard}}
dev_dependencies:
{{#firebase}}  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  firebase_core_platform_interface: ^6.0.3
{{/firebase}}{{#auth}}  firebase_auth_platform_interface: ^7.7.3
{{/auth}}{{#analytics}}  firebase_analytics_platform_interface: ^4.4.3
{{/analytics}}{{#crashlytics}}  firebase_crashlytics_platform_interface: ^3.8.10
{{/crashlytics}}{{#feature_flags}}  firebase_remote_config_platform_interface: ^2.0.0
{{/feature_flags}}{{#notifications}}  firebase_messaging_platform_interface: ^4.6.10
{{/notifications}}  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
{{#auth}}  fonts:
    # firebase_ui_auth ships this font but never registers it, so the Google
    # and Apple buttons render as tofu unless the app declares it here.
    - family: SocialIcons
      fonts:
        - asset: packages/firebase_ui_auth/fonts/SocialIcons.ttf
{{/auth}}
